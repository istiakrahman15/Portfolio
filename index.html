    <script>
      // Every visit and refresh starts at the lock-screen hero, never at a restored scroll position
      try {
        history.scrollRestoration = 'manual'
        if (location.hash) history.replaceState(null, '', location.pathname + location.search)
        scrollTo(0, 0)
        addEventListener('pageshow', function (e) {
          if (e.persisted) scrollTo(0, 0)
        })
      } catch (e) {}
    </script>
    <script>
      // dark is the default look; only a choice the visitor saved with the switch changes it
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
